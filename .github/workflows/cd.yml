name: CI/CD - Deploy no Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1) Integração Contínua: checagem de tipos e build
  ci:
    name: CI - Tipos e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js 24 com cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem de tipos (tsc --noEmit)
        run: pnpm --filter backend run type-check

      - name: Compilar o backend (tsc)
        run: pnpm --filter backend run build

  # 2) Validação do contêiner: o Docker build precisa passar
  docker-build:
    name: CD - Build da imagem Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t agendamento-api:${{ github.sha }} ./backend

  # 3) Deploy: só roda se CI e Docker build passaram
  deploy:
    name: CD - Disparar deploy no Render
    runs-on: ubuntu-latest
    needs: [ci, docker-build]

    steps:
      - name: Acionar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado no repositório."
            exit 1
          fi

          STATUS=$(curl -s -o resposta.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Status HTTP retornado pelo Render: $STATUS"
          cat resposta.txt

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::Falha ao disparar o deploy (HTTP $STATUS)."
            exit 1
          fi

          echo "Deploy disparado com sucesso."
